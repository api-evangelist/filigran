- name: OpenAEV REST API
  description: >-
    OpenAEV (formerly OpenBAS) is an ISO 22398-aligned platform for planning and
    running crisis exercises, adversary simulations, and breach-and-attack
    simulation. It ships a RESTful API and a UX-oriented frontend, with an
    official Python client (pyobas).
  humanURL: https://docs.openaev.io/latest/
