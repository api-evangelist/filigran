apis:
- name: OpenCTI GraphQL API
  description: >-
    The OpenCTI platform exposes a full GraphQL API on the /graphql endpoint for
    programmatic access to cyber threat intelligence knowledge modeled on STIX
    2.1. Authentication uses a per-user bearer API token. A GraphiQL-based
    playground is available on /public/graphql, and a native embedded MCP server
    is exposed for AI agents.
  humanURL: https://docs.opencti.io/latest/reference/api/
  baseURL: https://demo.opencti.io/graphql
  tags:
  - Threat Intelligence
  - GraphQL
  - STIX
  - OpenCTI
