aid: filigran
name: Filigran
description: >-
  Filigran is a cybersecurity company founded in 2022 that builds the eXtended
  Threat Management (XTM) suite of open-source and enterprise products for cyber
  threat intelligence, adversary simulation, and crisis management. Its flagship
  OpenCTI platform exposes a full GraphQL API for structuring, storing, and
  disseminating STIX 2.1 threat-intelligence knowledge, while OpenAEV (formerly
  OpenBAS) provides a RESTful API for breach-and-attack simulation and
  adversarial exposure validation. Filigran maintains official Python clients
  (pycti, pyobas), a native embedded Model Context Protocol (MCP) server, TAXII
  2.1 and SSE live-stream data sharing, webhooks, and a React component /
  design-system library. The company is SOC 2 Type 2 and ISO/IEC 27001:2022
  certified and is backed by Accel and Insight Partners.
